name: build-and-publish

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_ID: ghcr.io/eoepca/eoap-cwlwrap/eoap-cwlwrap

jobs:

  build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install tooling
        run: pip install hatch

      # -----------------------------
      # Strict SemVer + Hatch version gate
      # -----------------------------
      - name: Validate tag and hatch version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Ensure tag starts with v
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must follow strict SemVer format vX.Y.Z"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          HATCH_VERSION=$(hatch version)

          echo "Tag version:   $TAG_VERSION"
          echo "Hatch version: $HATCH_VERSION"

          if [ "$TAG_VERSION" != "$HATCH_VERSION" ]; then
            echo "ERROR: Git tag version does not match hatch version"
            exit 1
          fi

      - name: Type Check
        run: hatch run dev:typecheck

      - name: Ruff Lint
        run: hatch run dev:lint

      - name: Ruff Check
        run: hatch run dev:check

      - name: Security scan
        run: hatch run test:security

      - name: Test package
        run: hatch run test:test-cov

      - name: Build package
        run: hatch build

  publish:

    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install hatch
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(hatch version)"

          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${PROJECT_VERSION}"

          if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION}"
            exit 1
          fi

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # -----------------------------
      # Determine container tag
      # -----------------------------
      - name: Determine image tag
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            echo "IMAGE_TAG=latest-dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build container
        run: |
          docker build . -f Dockerfile -t eoap-cwlwrap
          docker tag eoap-cwlwrap $IMAGE_ID:${IMAGE_TAG}

      - name: Push container
        run: docker push $IMAGE_ID:${IMAGE_TAG}
