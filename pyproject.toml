[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eoap_cwlwrap"
dynamic = ["version"]
description = "Add stage-in/stage-out steps to EOAP CWL Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
  { name = "Simone Tripodi", email = "simone.tripodi@terradue.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
  "loguru==0.7.3",
  "transpiler-mate-api @ git+https://github.com/sim13pods/transpiler-mate-api.git@main",
]

# TODO remove me as soon as transpiler-mate-api is on PyPI
[tool.hatch.metadata]
allow-direct-references = true

[project.entry-points."transpiler_mate.plugins"]
cwlwrap = "eoap_cwlwrap.plugin:cwlwrap"

[project.urls]
Documentation = "https://eoepca.github.io/eoap-cwlwrap/"
Issues = "https://github.com/EOEPCA/eoap-cwlwrap/issues"
Source = "https://github.com/EOEPCA/eoap-cwlwrap"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "cwl_loader",
    "cwl_loader.*",
    "transpiler_mate.runtime",
    "transpiler_mate.runtime.*"
]
ignore_missing_imports = true

[tool.hatch.version]
path = "src/eoap_cwlwrap/__about__.py"

[tool.coverage.run]
source_pkgs = ["eoap_cwlwrap", "tests"]
branch = true
parallel = true
omit = [
  "src/eoap_cwlwrap/__about__.py",
]

[tool.coverage.paths]

tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.default]
skip-install = false

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "cwltool==3.2.20260720092025",
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff.lint]
# Start with the essential rules
select = [
  "F",    # Pyflakes (Critical for bugs)
  "E",    # pycodestyle Errors
  "W",    # pycodestyle Warnings
  "I",    # isort (Import sorting)
  "UP",   # pyupgrade (Modern syntax)
  "B",    # flake8-bugbear (Common bugs)
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe Complexity (Enables C901)
]

# Ignore rules that conflict with the formatter (Ruff Format/Black)
ignore = [
  "E501", # Line too long (handled by formatter)
  "W191", # Tab indentation (handled by formatter)
  "E111", # Indentation issues (handled by formatter)
  "E114", # Indentation issues (handled by formatter)
  "E117", # Over-indented (handled by formatter)
]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 10

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src tests}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src}"

[tool.hatch.envs.prod]
path = "/app/envs/eoap-cwlwrap"

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "cwltool==3.2.20260720092025",
  "transpiler-mate-runtime @ git+https://github.com/sim13pods/transpiler-mate-runtime.git",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=eoap_cwlwrap --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.docs]
skip-install = false

dependencies = [
  "pdocs==1.2.0",
  "mkdocs-material==9.7.5",
  "mkdocs-jupyter==0.25.1"
]

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy --force"
