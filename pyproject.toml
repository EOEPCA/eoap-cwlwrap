[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eoap_cwlwrap"
dynamic = ["version"]
description = "Add stage-in/stage-out steps to EOAP CWL Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
  { name = "Simone Tripodi", email = "simone.tripodi@terradue.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
  "click==8.4.1",
  "cwl-loader==0.22.0",
  "cwl-utils==0.41",
  "loguru==0.7.3",
  "session-adapters==0.3.0"
]

[project.urls]
Documentation = "https://eoepca.github.io/eoap-cwlwrap/"
Issues = "https://github.com/EOEPCA/eoap-cwlwrap/issues"
Source = "https://github.com/EOEPCA/eoap-cwlwrap"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "cwl_loader",
    "cwl_loader.*",
    "session_adapters",
    "session_adapters.*",
]
ignore_missing_imports = true

[tool.hatch.version]
path = "src/eoap_cwlwrap/__about__.py"

[tool.coverage.run]
source_pkgs = ["eoap_cwlwrap", "tests"]
branch = true
parallel = true
omit = [
  "src/eoap_cwlwrap/__about__.py",
]

[tool.coverage.paths]

tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.default]
skip-install = false

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "mypy>=2.3.0",
  "ruff>=0.16.0",
]

[tool.ruff.lint]
select = ["E", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src tests}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"

[tool.hatch.envs.prod]
path = "/app/envs/eoap-cwlwrap"

[project.scripts]
eoap-cwlwrap = "eoap_cwlwrap.builder:main"

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "cwltool==3.1.20260315121657",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=eoap_cwlwrap --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.docs]
skip-install = false

dependencies = [
  "pdocs==1.2.0",
  "mkdocs-material==9.7.5",
  "mkdocs-jupyter==0.25.1"
]

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy --force"
